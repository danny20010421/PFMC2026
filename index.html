  --shadow: 0 1px 2px rgba(11, 37, 69, .06), 0 4px 16px rgba(11, 37, 69, .06);
  --font: 'Noto Sans TC', 'PingFang TC', 'Hiragino Sans', 'Microsoft JhengHei', system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.6; }
body { min-height: 100vh; min-height: 100dvh; overflow-x: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--blue); }
.num, .kpi-value, td.r, .amt { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'; }
.up { color: var(--up); } .down { color: var(--down); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); border: 0; }
:focus-visible { outline: 3px solid #7FB0F0; outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }

/* ───────── 登入頁 ───────── */
.login { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: var(--s3) var(--s2);
  background: linear-gradient(180deg, #FFFFFF 0%, #F2F6FB 100%); }
.login-card { width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--s2); }
.brand { display: flex; flex-direction: column; align-items: center; gap: var(--s1); }
.brand-mark { width: 48px; height: 48px; border-radius: 12px; background: var(--navy); display: flex; align-items: center; justify-content: center; }
.brand-en { font-size: 12px; letter-spacing: .3em; color: var(--sub); }
.brand-zh { font-size: 24px; font-weight: 700; color: var(--navy); letter-spacing: .08em; margin: 0; line-height: 1.4; }
.clock { width: 100%; padding: var(--s2); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; }
.clock-label { font-size: 12px; letter-spacing: .2em; color: var(--sub); }
.clock-time { font-size: 40px; font-weight: 300; color: var(--navy); letter-spacing: .04em; line-height: 1.2; font-variant-numeric: tabular-nums; }
.clock-date { font-size: 14px; color: var(--sub); }
.sprite-wrap { display: flex; align-items: center; justify-content: center; gap: var(--s2); width: 100%; min-height: 96px; }
.sprite { width: 80px; height: 80px; flex: 0 0 80px; animation: bob 3s ease-in-out infinite; cursor: pointer; border: 0; padding: 0; background: none; }
.sprite svg { width: 100%; height: 100%; display: block; }
.sprite .eye { animation: blink 4s infinite; transform-origin: center; transform-box: fill-box; }
.bubble { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--s1) var(--s2); font-size: 14px; color: var(--ink); box-shadow: var(--shadow);
  max-width: 240px; min-height: 48px; display: flex; align-items: center; justify-content: center; text-align: center; line-height: 1.5; }
.bubble::before { content: ''; position: absolute; left: -7px; top: 50%; width: 12px; height: 12px; background: var(--card); border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); transform: translateY(-50%) rotate(45deg); }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@media (prefers-reduced-motion: reduce) { .sprite, .sprite .eye { animation: none; } * { transition: none !important; } }
.login-form { width: 100%; display: flex; flex-direction: column; gap: var(--s2); }
.row-ctl { display: flex; gap: var(--s1); align-items: stretch; width: 100%; }
.row-ctl > * { height: var(--ctl); }
.row-ctl input { flex: 1 1 auto; min-width: 0; }
.login-links { display: flex; justify-content: center; align-items: center; gap: var(--s2); flex-wrap: wrap; font-size: 14px; }
.login-note { font-size: 12px; color: var(--mute); line-height: 1.6; }

/* ───────── 控制項 ───────── */
.input, input[type=text], input[type=password], input[type=number], input[type=date], input[type=time], input[type=email], input[type=url], select, textarea {
  width: 100%; height: var(--ctl); padding: 0 var(--s2); border: 1px solid #CBD4E0; border-radius: var(--r); background: #fff; font-size: 16px; line-height: 1.2;
  -webkit-appearance: none; appearance: none; }
input[type=date], input[type=time] { display: flex; align-items: center; min-width: 0; }
select { background-image: linear-gradient(45deg, transparent 50%, var(--sub) 50%), linear-gradient(135deg, var(--sub) 50%, transparent 50%);
  background-position: calc(100% - 20px) 50%, calc(100% - 15px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: var(--s5); }
textarea { height: auto; min-height: 96px; padding: 12px var(--s2); line-height: 1.6; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(30, 90, 168, .15); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s1); height: var(--ctl); min-width: var(--ctl); padding: 0 var(--s2); border-radius: var(--r);
  border: 1px solid var(--navy); background: var(--navy); color: #fff; font-weight: 500; font-size: 15px; cursor: pointer; white-space: nowrap; text-decoration: none; line-height: 1; }
.btn:hover { background: var(--navy-2); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-ghost { background: #fff; color: var(--navy); border-color: #CBD4E0; }
.btn-ghost:hover { background: var(--blue-soft); }
.btn-danger { background: #fff; color: var(--up); border-color: #F0C8C8; }
.btn-sm { height: 40px; min-width: 40px; padding: 0 12px; font-size: 14px; }
.btn-block { width: 100%; }
.btn svg { width: 20px; height: 20px; flex: 0 0 20px; }
.link-btn { background: none; border: 0; color: var(--blue); cursor: pointer; padding: var(--s1); min-height: 40px; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field > label, .field > .lbl { font-size: 13px; color: var(--sub); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s2); }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s1); }
.grid2 > *, .grid3 > * { min-width: 0; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid #CBD4E0; border-radius: var(--r); overflow: hidden; height: var(--ctl); background: #fff; }
.seg button { border: 0; background: none; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 15px; color: var(--sub); height: 100%; padding: 0 var(--s1); }
.seg button + button { border-left: 1px solid #CBD4E0; }
.seg button[aria-pressed=true] { background: var(--navy); color: #fff; font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: var(--s1); }
.chip { height: 40px; padding: 0 var(--s2); border-radius: 20px; border: 1px solid #CBD4E0; background: #fff; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; color: var(--ink); }
.chip[aria-pressed=true] { background: var(--navy); border-color: var(--navy); color: #fff; }
.check { display: flex; align-items: center; gap: var(--s1); min-height: 40px; font-size: 15px; cursor: pointer; }
.check input { width: 20px; height: 20px; margin: 0; accent-color: var(--navy); }

/* ───────── App 外框 ───────── */
.topbar { position: sticky; top: 0; z-index: 20; height: calc(var(--top-h) + env(safe-area-inset-top)); padding: env(safe-area-inset-top) var(--s2) 0; background: rgba(255, 255, 255, .96);
  border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: var(--s1); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.topbar-title { display: flex; align-items: center; gap: var(--s1); min-width: 0; height: 100%; }
.topbar-title h1 { font-size: 17px; margin: 0; color: var(--navy); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1; }
.back { width: 40px; height: 40px; border: 0; background: none; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--navy); margin-left: -8px; border-radius: var(--r); }
.topbar-right { display: flex; align-items: center; gap: var(--s1); height: 100%; }
.tw-time { font-size: 12px; color: var(--sub); text-align: right; line-height: 1.3; display: flex; flex-direction: column; justify-content: center; font-variant-numeric: tabular-nums; }
.sync { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 0; background: none; cursor: pointer; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: #2E7D32; display: block; }
.sync[data-s=saving] i { background: #B26A00; } .sync[data-s=error] i { background: #C62828; } .sync[data-s=demo] i { background: #8B62D1; }
main { max-width: 720px; margin: 0 auto; padding: var(--s2) var(--s2) calc(var(--nav-h) + var(--s4) + env(safe-area-inset-bottom)); }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
  background: #fff; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); }
.tabbar a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: var(--mute); font-size: 11px; height: var(--nav-h); }
.tabbar a svg { width: 24px; height: 24px; }
.tabbar a[aria-current=page] { color: var(--navy); font-weight: 700; }
.demo-banner { background: #F1EBFB; color: #5A3D8A; font-size: 13px; padding: var(--s1) var(--s2); text-align: center; display: flex; align-items: center; justify-content: center; gap: var(--s1); min-height: 40px; }

/* ───────── 版面元件 ───────── */
.sec { margin: var(--s4) 0 var(--s2); }
.sec:first-child { margin-top: var(--s1); }
.sec-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--s1); padding-bottom: var(--s1); border-bottom: 2px solid var(--navy); margin-bottom: var(--s2); }
.sec-no { font-size: 11px; letter-spacing: .25em; color: var(--sub); display: block; line-height: 1.4; }
.sec-title { font-size: 18px; font-weight: 700; color: var(--navy); margin: 0; line-height: 1.4; }
.sec-head .act { flex: 0 0 auto; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: var(--s2); }
.card + .card { margin-top: var(--s2); }
.card-title { font-size: 15px; font-weight: 700; color: var(--navy); margin: 0 0 var(--s1); }
.muted { color: var(--sub); font-size: 13px; }
.tiny { font-size: 12px; color: var(--mute); }
.stack > * + * { margin-top: var(--s2); }
.stack-sm > * + * { margin-top: var(--s1); }
.hr { height: 1px; background: var(--line); margin: var(--s2) 0; border: 0; }
.right { text-align: right; } .center { text-align: center; }
.flex { display: flex; align-items: center; gap: var(--s1); } .between { justify-content: space-between; } .wrap { flex-wrap: wrap; }
.grow { flex: 1 1 auto; min-width: 0; }

/* KPI 2×2：同寬同高、內容置中、不溢出 */
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 1fr; gap: var(--s1); }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); min-height: 112px; padding: var(--s2) var(--s1);
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 4px; overflow: hidden; min-width: 0; }
.kpi-label { font-size: 12px; color: var(--sub); letter-spacing: .05em; line-height: 1.4; }
.kpi-value { font-size: clamp(17px, 5.2vw, 24px); font-weight: 700; color: var(--navy); line-height: 1.25; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi-sub { font-size: 12px; line-height: 1.4; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.kpi.dark { background: var(--navy); border-color: var(--navy); }
.kpi.dark .kpi-label, .kpi.dark .kpi-sub { color: #C6D3E6; } .kpi.dark .kpi-value { color: #fff; }
.trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s1); }
.trio .kpi { min-height: 88px; }
.trio .kpi-value { font-size: clamp(15px, 4.4vw, 20px); }

/* 進度條 */
.prog { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.prog > i { display: block; height: 100%; background: var(--navy-2); border-radius: 4px; transition: width .6s ease; }
.prog.lg { height: 16px; border-radius: 8px; } .prog.lg > i { border-radius: 8px; }
.goal-head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s1); margin-bottom: var(--s1); }
.goal-pct { font-size: 28px; font-weight: 700; color: var(--navy); line-height: 1; font-variant-numeric: tabular-nums; }
.goal-meta { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s1); margin-top: var(--s2); }
.goal-meta > div { text-align: center; padding: var(--s1) 4px; background: var(--bg); border-radius: var(--r); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 64px; }
.goal-meta b { font-size: 15px; color: var(--navy); font-variant-numeric: tabular-nums; } .goal-meta span { font-size: 11px; color: var(--sub); }

/* 列表 */
.list { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.item { display: flex; align-items: center; gap: var(--s2); padding: 12px var(--s2); min-height: 64px; border-bottom: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; cursor: pointer; }
.item:last-child { border-bottom: 0; }
.item:hover { background: #FAFBFD; }
.item-icon { width: 40px; height: 40px; flex: 0 0 40px; border-radius: var(--r); background: var(--blue-soft); color: var(--navy); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; overflow: hidden; }
.item-icon.sym { font-size: 10px; letter-spacing: -.02em; width: 48px; flex-basis: 48px; }
.item-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
.item-title { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.4; }
.item-sub { font-size: 12px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.4; }
.item-right { flex: 0 0 auto; text-align: right; display: flex; flex-direction: column; justify-content: center; align-items: flex-end; }
.item-amt { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.4; white-space: nowrap; }
.date-head { font-size: 12px; color: var(--sub); padding: var(--s1) var(--s2); background: var(--bg); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
.empty { padding: var(--s4) var(--s2); text-align: center; color: var(--sub); font-size: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--s1); }
.badge { display: inline-flex; align-items: center; justify-content: center; height: 20px; padding: 0 6px; font-size: 11px; border-radius: 4px; background: var(--blue-soft); color: var(--navy); font-weight: 500; vertical-align: middle; white-space: nowrap; line-height: 1; }
.badge.ok { background: var(--ok-bg); color: var(--down); } .badge.warn { background: var(--warn-bg); color: var(--warn); } .badge.err { background: var(--err-bg); color: var(--up); }

/* 表格 */
.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: var(--r); background: #fff; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th, .tbl td { padding: 10px var(--s1); border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; white-space: nowrap; }
.tbl th { color: var(--sub); font-weight: 500; background: #FAFBFD; }
.tbl td.r, .tbl th.r { text-align: right; }
.tbl tr:last-child td { border-bottom: 0; }

/* 圖表 */
.chart-box { position: relative; width: 100%; height: 240px; }
.chart-box.sm { height: 200px; }
.donut-wrap { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s2); align-items: center; }
.legend { display: flex; flex-direction: column; gap: var(--s1); }
.legend-row { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto auto; gap: var(--s1); align-items: center; font-size: 13px; min-height: 24px; }
.legend-row i { width: 12px; height: 12px; border-radius: 3px; display: block; }
.legend-row .v { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; min-width: 52px; }
.legend-row .t { color: var(--mute); font-size: 12px; text-align: right; min-width: 64px; }

/* 評分 */
.score-hero { display: flex; align-items: center; justify-content: center; gap: var(--s3); padding: var(--s1) 0 var(--s2); }
.ring { width: 112px; height: 112px; position: relative; flex: 0 0 112px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-txt { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring-txt b { font-size: 30px; color: var(--navy); line-height: 1; font-variant-numeric: tabular-nums; } .ring-txt span { font-size: 12px; color: var(--sub); margin-top: 4px; }
.score-row { padding: 12px 0; border-bottom: 1px solid var(--line); }
.score-row:last-child { border-bottom: 0; }
.score-row .flex { margin-bottom: 6px; font-size: 14px; }
.score-detail { font-size: 13px; color: var(--sub); margin-top: var(--s1); line-height: 1.7; }
.score-detail b { color: var(--ink); font-weight: 500; margin-right: 4px; }

/* 提醒 */
.alert { display: flex; gap: 12px; align-items: center; padding: 12px var(--s2); border-radius: var(--r); background: var(--warn-bg); color: #6B4A00; font-size: 14px; min-height: 48px; }
.alert + .alert { margin-top: var(--s1); }
.alert.info { background: var(--blue-soft); color: var(--navy); } .alert.ok { background: var(--ok-bg); color: #1F5A23; }
.alert svg { flex: 0 0 20px; width: 20px; height: 20px; }

/* 快捷功能格 */
.quick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s1); }
.quick a, .quick button { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); min-height: 88px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--s1);
  text-decoration: none; color: var(--navy); font-size: 13px; font-weight: 500; cursor: pointer; padding: var(--s1); text-align: center; }
.quick svg { width: 24px; height: 24px; }

/* 首頁問候 */
.hello { display: flex; align-items: center; gap: var(--s2); padding: var(--s2); background: var(--card); border: 1px solid var(--line); border-radius: var(--r); }
.hello .sprite { width: 56px; height: 56px; flex: 0 0 56px; }
.hello-txt { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
.hello-txt b { font-size: 16px; color: var(--navy); line-height: 1.4; } .hello-txt span { font-size: 13px; color: var(--sub); line-height: 1.5; }

/* 新聞 */
.news-item { padding: var(--s2); border-bottom: 1px solid var(--line); }
.news-item:last-child { border-bottom: 0; }
.news-title { font-size: 15px; font-weight: 500; color: var(--navy); text-decoration: none; line-height: 1.6; display: block; }
.news-meta { font-size: 12px; color: var(--sub); margin-top: 4px; display: flex; flex-wrap: wrap; gap: var(--s1); align-items: center; }
.news-acts { display: flex; gap: var(--s1); margin-top: var(--s1); }

/* AI 聊天 */
.chat { display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 92%; padding: 12px var(--s2); border-radius: var(--r-lg); font-size: 15px; line-height: 1.7; word-break: break-word; }
.msg.user { align-self: flex-end; background: var(--navy); color: #fff; border-bottom-right-radius: 4px; white-space: pre-wrap; }
.msg.bot { align-self: flex-start; background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg.bot h4 { margin: var(--s1) 0 4px; font-size: 15px; color: var(--navy); }
.msg.bot ul, .msg.bot ol { margin: 4px 0; padding-left: 20px; }
.msg.bot p { margin: 4px 0; }
.msg .srcs { margin-top: var(--s1); padding-top: var(--s1); border-top: 1px dashed var(--line); font-size: 12px; }
.msg .srcs a { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.8; }
.msg .meta { font-size: 11px; color: var(--mute); margin-top: 4px; }
.composer { position: sticky; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom)); background: var(--bg); padding: var(--s1) 0; display: flex; gap: var(--s1); align-items: flex-end; }
.composer textarea { min-height: var(--ctl); height: var(--ctl); max-height: 160px; padding-top: 12px; resize: none; }
.composer .btn { flex: 0 0 var(--ctl); padding: 0; }
.typing { display: inline-flex; gap: 4px; align-items: center; height: 24px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--mute); animation: tp 1s infinite; }

/* ═════════════ 設計方向 B「藍印」主題層（覆蓋上方基礎樣式） ═════════════ */
:root {
  --navy: #0B2545; --navy-2: #13315C; --blue: #2F6BFF; --blue-soft: #EAF0FF; --sky: #8FB4FF;
  --ink: #0F1B2D; --sub: #64748B; --mute: #94A3B8; --line: #E2E8F2; --bg: #F3F6FB; --card: #FFFFFF;
  --up: #D64545; --down: #16A34A; --ok-bg: #E8F7EE; --err-bg: #FDECEC; --warn-bg: #FFF5E5; --warn: #B26A00;
  --r: 14px; --r-lg: 20px; --r-xl: 24px;
  --shadow: 0 2px 10px rgba(11, 37, 69, .06);
  --shadow-lg: 0 18px 40px rgba(11, 37, 69, .16);
  --nav-h: 64px;
}
body { background: var(--bg); color: var(--ink); }

/* 標誌 */
.logo { width: 72px; height: 72px; display: block; filter: drop-shadow(0 8px 20px rgba(0, 0, 0, .25)); }

  background: linear-gradient(170deg, var(--navy) 0%, var(--navy-2) 340px, var(--bg) 340.5px); min-height: 100vh; min-height: 100dvh; }
.login-hero { width: 100%; padding: calc(var(--s6) + env(safe-area-inset-top)) var(--s2) var(--s4); display: flex; justify-content: center; }
.login .brand { gap: 12px; color: #fff; }

.login .brand-en { color: rgba(255, 255, 255, .7); letter-spacing: .4em; margin-right: -.4em; font-size: 11px; }
.login-card { width: calc(100% - 32px); max-width: 420px; background: var(--card); border-radius: var(--r-xl); box-shadow: var(--shadow-lg);
  padding: var(--s3) var(--s2) var(--s2); display: flex; flex-direction: column; align-items: center; gap: var(--s2); text-align: center; }

.login-links { gap: var(--s1); }

.login-note .link-btn { min-height: 24px; padding: 0; font-size: 12px; }

/* 控制項 */
.input, input[type=text], input[type=password], input[type=number], input[type=date], input[type=time], input[type=email], input[type=url], select, textarea {
  border: 1.5px solid transparent; background-color: var(--bg); border-radius: var(--r); }

/* App 外框 */

.tabbar { left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); height: var(--nav-h); padding: 0 4px; border: 0; border-radius: 22px;

.sheet { border-radius: var(--r-xl) var(--r-xl) 0 0; }

/* 首頁主卡 */
.hero-card { position: relative; overflow: hidden; border-radius: var(--r-xl); padding: 20px var(--s2) var(--s2); color: #fff;
  background: radial-gradient(130% 120% at 100% 0%, #2C5A9E 0%, var(--navy) 62%); box-shadow: 0 14px 30px rgba(11, 37, 69, .22); }

.dots { font-size: .55em; letter-spacing: .12em; vertical-align: middle; display: inline-block; line-height: 1; }

.dimrow .sc { font-size: 20px; font-weight: 800; color: var(--navy); min-width: 40px; text-align: right; font-variant-numeric: tabular-nums; }
.gr { width: 40px; height: 40px; flex: 0 0 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #fff; font-size: 14px; }

  // ───────── 匯率 ─────────

  // ───────── 股票持倉（平均成本法） ─────────

      var s = t.symbol;

  // ───────── 年度計畫 ─────────

  // ───────── 當日交易復盤（量化部分） ─────────

      else if (actual < tgt) { allocScore += 20; notes.push('補足' + CLASSES[cls].label + '配置缺口'); }
      if (cls === 'satellite' && w > 0.1) { allocScore -= 25; notes.push('單一個股權重 ' + pct(w) + ' 超過 10%'); }

    function f(key, label, w) {
      var x = idx[key]; if (!x || x.changePct == null) return;
      facts.push(label + ' ' + fmt(x.close, 2) + '（' + signed(x.changePct * 100, 2) + '%，' + (x.date || '') + '）');
      s += x.changePct * 100 * w;
    }
    f('TWII', '加權指數', 1); f('GSPC', 'S&P 500', 0.6); f('IXIC', 'Nasdaq', 0.4); f('SOX', '費城半導體', 0.6);
    var vix = idx.VIX && idx.VIX.close;
    if (vix) { facts.push('VIX ' + fmt(vix, 2)); if (vix > 25) s -= 2; else if (vix < 16) s += 0.5; }
    var label = !facts.length ? '資料不足' : s > 1 ? 'Risk-on' : s < -1 ? 'Risk-off' : '中性';
    return { label: label, score: round(s, 2), facts: facts };
  }

  // ───────── 行動建議（規則式） ─────────
  function actions(data, sum, sc) {
    var a = { d7: [], m3: [], goal: [] };
    var short = sum.unsettledNet - (sum.cashByType.broker || 0);
    if (sum.unsettled.length) a.d7.push('確認 ' + sum.unsettled.length + ' 筆待交割，交割帳戶需備足 ' + fmt(Math.max(0, sum.unsettledNet)) + ' 元' + (short > 0 ? '（目前券商帳戶不足 ' + fmt(short) + ' 元，請轉帳）' : ''));
    sum.payRows.forEach(function (l) { if (l.due && diffDays(sum.date, l.due) <= 7) a.d7.push('應付「' + l.name + '」' + fmt(l.amount) + ' 元，' + l.due + ' 到期'); });
    sum.recvRows.forEach(function (l) { if (l.due && diffDays(sum.date, l.due) <= 7) a.d7.push('追蹤應收「' + l.name + '」' + fmt(l.amount) + ' 元（' + l.due + '）'); });
    var weak = sc.items.slice().sort(function (x, y) { return x.priority - y.priority; });
    weak.slice(0, 2).forEach(function (x) { if (x.score < 80) a.m3.push(x.label + '：' + x.improve); });
    var fin = sum.financial || 1, ta = data.targetAllocation, tsum = 0;
    Object.keys(ta).forEach(function (k) { tsum += num(ta[k]); });
    Object.keys(ta).forEach(function (k) {
      var d = (sum.alloc[k] || 0) / fin - num(ta[k]) / (tsum || 100);
      if (d < -0.05) a.m3.push(CLASSES[k].label + ' 低於目標 ' + pct(-d) + '，新資金優先分批補足（約 ' + fmt(-d * fin) + ' 元）');
      if (d > 0.05) a.m3.push(CLASSES[k].label + ' 高於目標 ' + pct(d) + '，暫停加碼並考慮再平衡');
    });
    var target = sum.target, gap = Math.max(0, target - sum.netWorth);
    var days = diffDays(sum.date, data.profile.targetDate || addDays(sum.date, 730));
    var months = Math.max(days / 30.44, 1);
    a.goal.push('距目標 ' + fmt(target) + ' 元尚差 ' + fmt(gap) + ' 元，剩約 ' + round(months, 0) + ' 個月，平均每月需增加 ' + fmt(gap / months) + ' 元');
    var monthlySave = Math.max(0, sum.avgIncome - sum.avgExpense);
    if (monthlySave > 0) a.goal.push('以近期每月結餘約 ' + fmt(monthlySave) + ' 元估算，' + (monthlySave * months >= gap ? '僅靠儲蓄即可如期達標，無須提高風險' : '仍差 ' + fmt(gap - monthlySave * months) + ' 元，建議提高儲蓄率或延後目標日，而非提高投資風險'));
    if (!a.d7.length) a.d7.push('本週無到期款項；照常記帳並檢查預算');
    if (!a.m3.length) a.m3.push('配置與評分皆在合理範圍，維持定期定額與每季再平衡');
    return a;
  }

  // ───────── 組裝報表 ─────────
  function buildReport(data, ctx) {
    ctx = ctx || {};
    data = normalize(data);
    var today = ctx.today || twDay();
    var sum = summarize(data, ctx.quotes || {}, ctx.fx || {}, today);
    var sc = scores(data, sum);
    var todayTrades = (data.trades || []).filter(function (t) { return t.date === today && !t.opening && t.side !== 'adjust'; });
    var reviews = todayTrades.map(function (t) { return tradeReview(t, (ctx.ohlc || {})[t.symbol], data, sum); });
    return {
      date: today, generatedAt: twDay() + ' ' + twTime(), name: data.profile.name,
      summary: sum, scores: sc, fx: ctx.fx || null, reviews: reviews,
      sentiment: sentiment(ctx.indices), plans: (data.plans || []).map(function (p) { return { plan: p, prog: planProgress(p, sum, data) }; }),
      actions: actions(data, sum, sc), news: ctx.news || { tw: [], intl: [] }, ai: ctx.ai || {},
      targetAllocation: data.targetAllocation, profile: data.profile
    };
  }

  // ───────── 報表 HTML（Email 與網頁共用；全部 inline style，相容 Gmail） ─────────
  var C = { navy: '#0B2545', navy2: '#1F4FD1', ink: '#1B2633', sub: '#5B6B7F', line: '#E3E8EF', bg: '#F5F7FA', up: '#C62828', down: '#2E7D32', warn: '#B26A00' };
  // 台股慣例：紅漲綠跌
  function pl(v, d) { var c = v > 0 ? C.up : v < 0 ? C.down : C.ink; return '<span style="color:' + c + ';font-weight:600">' + signed(v, d) + '</span>'; }
  function plp(v) { var c = v > 0 ? C.up : v < 0 ? C.down : C.ink; return '<span style="color:' + c + '">' + (v > 0 ? '+' : '') + pct(v, 2) + '</span>'; }
  function sec(no, title, body) {
    return '<tr><td style="padding:24px 16px 8px"><div style="font-size:12px;letter-spacing:2px;color:' + C.sub + '">' + no + '</div>' +
      '<div style="font-size:18px;font-weight:700;color:' + C.navy + ';border-bottom:2px solid ' + C.navy + ';padding-bottom:8px">' + title + '</div></td></tr>' +
      '<tr><td style="padding:8px 16px">' + body + '</td></tr>';
  }
  function kpi(label, value, sub) {
    return '<td width="50%" valign="middle" align="center" style="width:50%;height:96px;padding:12px 8px;border:1px solid ' + C.line + ';background:#fff;text-align:center">' +
      '<div style="font-size:12px;color:' + C.sub + '">' + label + '</div>' +
      '<div style="font-size:20px;font-weight:700;color:' + C.navy + ';margin-top:4px;white-space:nowrap">' + value + '</div>' +
      (sub ? '<div style="font-size:12px;margin-top:4px">' + sub + '</div>' : '') + '</td>';
  }
  function table(head, rows, alignRight) {
    var h = '<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;font-size:13px">';
    h += '<tr>' + head.map(function (x, i) { return '<th style="text-align:' + (i && alignRight ? 'right' : 'left') + ';padding:8px 4px;color:' + C.sub + ';font-weight:500;border-bottom:1px solid ' + C.line + '">' + x + '</th>'; }).join('') + '</tr>';
    rows.forEach(function (r) { h += '<tr>' + r.map(function (x, i) { return '<td style="text-align:' + (i && alignRight ? 'right' : 'left') + ';padding:8px 4px;border-bottom:1px solid ' + C.line + ';vertical-align:middle">' + x + '</td>'; }).join('') + '</tr>'; });
    return h + '</table>';
  }
  function bar(ratio, color) {
    var w = Math.round(clamp(ratio * 100));
    return '<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;height:8px"><tr>' +
      (w > 0 ? '<td width="' + w + '%" style="background:' + (color || C.navy2) + ';height:8px;font-size:0;line-height:0">&nbsp;</td>' : '') +
      (w < 100 ? '<td style="background:' + C.line + ';height:8px;font-size:0;line-height:0">&nbsp;</td>' : '') + '</tr></table>';
  }
  function p(t, style) { return '<p style="margin:8px 0;line-height:1.7;' + (style || '') + '">' + t + '</p>'; }
  function list(items) { return items && items.length ? '<ul style="margin:4px 0;padding-left:20px;line-height:1.7">' + items.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>' : p('—'); }
  function aiBlock(text) {
    if (!text) return '';
    return '<div style="margin-top:8px;padding:12px;background:' + C.bg + ';border-left:3px solid ' + C.navy2 + ';font-size:13px;line-height:1.7;white-space:pre-wrap">' + esc(text) + '</div>';
  }

  function reportHTML(r) {
    var s = r.summary, h = '';
    var hdr = '<tr><td style="background:' + C.navy + ';color:#fff;padding:24px 16px;text-align:center">' +

      '<div style="font-size:22px;font-weight:700;margin-top:8px">每日財務報表</div>' +
      '<div style="font-size:13px;margin-top:8px;opacity:.9">' + r.date + '（台灣時間）· 產生於 ' + r.generatedAt + '</div></td></tr>';

    // 1 總覽
    var kp = '<table role="presentation" width="100%" cellpadding="0" cellspacing="8" style="border-collapse:separate;table-layout:fixed">' +
      '<tr>' + kpi('淨資產', 'NT$' + fmt(s.netWorth), '目標達成 ' + pct(s.netWorth / s.target)) + kpi('金融資產總市值', 'NT$' + fmt(s.financial), '') + '</tr>' +
      '<tr>' + kpi('股票總市值', 'NT$' + fmt(s.investValue), plp(s.uplPct)) + kpi('財務評分', r.scores.total + ' / 100', '等級 ' + r.scores.grade) + '</tr></table>';

    cashRows.push(['<b>合計</b>', '', '', '', '<b>' + fmt(s.cashTotal) + '</b>']);
    var ar = table(['類型', '項目', '金額', '到期'], s.recvRows.map(function (l) { return ['應收', esc(l.name), fmt(l.amount), l.due || '—']; })
      .concat(s.payRows.map(function (l) { return ['應付', esc(l.name), fmt(l.amount), l.due || '—']; })), true);
    h += sec('02', '現金分類與應收／應付', table(['帳戶', '類別', '幣別', '原幣餘額', '台幣'], cashRows, true) +

    // 3 外幣
    var fxr = r.fx && r.fx.rates ? Object.keys(r.fx.rates).filter(function (k) { return ['USD', 'JPY', 'EUR', 'CNY', 'HKD', 'GBP', 'AUD'].indexOf(k) >= 0; }).map(function (k) { return [k, fmt(r.fx.rates[k], 4), '1 TWD = ' + fmt(1 / r.fx.rates[k], 4) + ' ' + k]; }) : [];
    h += sec('03', '外幣換算', fxr.length ? table(['幣別', '兌台幣（即期中價）', '反向'], fxr, true) + p('來源：' + esc(r.fx.source || '') + '，' + esc(r.fx.date || ''), 'font-size:12px;color:' + C.sub) : p('未取得匯率'));

    // 4 股票明細
    var hr = s.holdings.map(function (x) {

    });
    var dates = {}; s.holdings.forEach(function (x) { if (x.priceDate) dates[x.priceDate] = 1; });
    var dlist = Object.keys(dates);
    var stockBody = s.holdings.length ? table(['代號', '股數', '均價', '收盤', '市值', '未實現'], hr, true) +
      table(['', '金額'], [['總成本', fmt(s.investCost)], ['總市值', fmt(s.investValue)], ['總未實現損益', pl(s.upl) + '（' + plp(s.uplPct) + '）'], ['已實現損益（累計）', pl(s.realized)]], true) +
      p('收盤價基準日：' + (dlist.join('、') || '—') + (dlist.length > 1 ? '（⚠ 持股報價日期不一致，請留意）' : '') + '。✓ = 兩個以上來源交叉驗證一致。', 'font-size:12px;color:' + C.sub)
      : p('目前無持股');
    h += sec('04', '股票明細與損益', stockBody);

    // 4b 當日交易復盤（無交易則整區省略）
    if (r.reviews && r.reviews.length) {
      var rv = r.reviews.map(function (x) {
        var t = x.trade, o = x.ohlc;
        var lines = [];
        lines.push('<b>' + (t.side === 'buy' ? '買進' : '賣出') + ' ' + esc(t.symbol) + ' ' + esc(t.name || '') + '</b>　' + fmt(t.qty) + ' 股 @ ' + fmt(t.price, 2));
        if (o) lines.push('當日 開 ' + fmt(o.open, 2) + '／高 ' + fmt(o.high, 2) + '／低 ' + fmt(o.low, 2) + '／收 ' + fmt(o.close, 2) + (o.vwap ? '／VWAP ' + fmt(o.vwap, 2) : '') + '（' + esc(o.source || '') + '）');
        if (x.position != null) lines.push('成交位置：當日區間 ' + round(x.position * 100, 0) + '% 處' + (x.vsVwap != null ? '，相對 VWAP ' + signed(x.vsVwap * 100, 2) + '%' : '') + ' → <b>' + x.priceVerdict + '</b>');
        else lines.push('價格品質：' + x.priceVerdict);

        lines.push('交易品質分數：<b style="font-size:16px;color:' + C.navy + '">' + x.score + '（' + x.grade + '）</b>　價格 ' + round(x.priceScore) + '／配置 ' + x.allocScore + '／風險 ' + x.riskScore);
        return '<div style="padding:12px;border:1px solid ' + C.line + ';margin-bottom:8px">' + lines.map(function (l) { return p(l, 'margin:4px 0'); }).join('') + '</div>';
      }).join('');
      var sent = '<div style="margin:8px 0;padding:12px;background:' + C.bg + '"><b>市場事實</b>' + list(r.sentiment.facts) + '<b>情緒判讀：' + r.sentiment.label + '</b>（規則式分數 ' + r.sentiment.score + '，僅供參考）</div>';
      h += sec('04-B', '當日交易復盤', rv + sent + aiBlock(r.ai.tradeReview) +

    }

    h += sec('05', '金融資產總市值', table(['項目', '金額（台幣）'], [['現金', fmt(s.cashTotal)], ['股票／ETF', fmt(s.investValue)], ['其他金融資產', fmt(s.otherTotal)], ['<b>金融資產總市值</b>', '<b>' + fmt(s.financial) + '</b>'], ['應收', fmt(s.receivable)], ['應付', '-' + fmt(s.payable)], ['<b>淨資產</b>', '<b>' + fmt(s.netWorth) + '</b>']], true));

    // 6 配置圖
    var fin = s.financial || 1, ta = r.targetAllocation || {}, tsum = 0;

    var allocRows = Object.keys(CLASSES).filter(function (k) { return (s.alloc[k] || 0) > 0 || ta[k]; }).map(function (k) {

        '<td style="padding:6px 8px">' + bar(w, CLASSES[k].color) + '</td><td style="width:120px;text-align:right;font-size:13px;white-space:nowrap">' + pct(w) + ' <span style="color:' + C.sub + '">／目標 ' + pct(num(ta[k]) / (tsum || 100), 0) + '</span></td></tr>';
    }).join('');
    h += sec('06', '資產配置（核心－衛星）', '<table role="presentation" width="100%" cellpadding="0" cellspacing="0">' + allocRows + '</table>');

    // 7 評分

    }).join('');
    h += sec('07', '專業財務評分（100 分制）', '<div style="text-align:center;padding:8px 0"><span style="font-size:36px;font-weight:700;color:' + C.navy + '">' + r.scores.total + '</span><span style="color:' + C.sub + '"> / 100　等級 ' + r.scores.grade + '</span></div>' + scRows);

    // 8 建議與目標
    var plans = (r.plans || []).map(function (x) {

        '<div style="font-size:12px;color:' + C.sub + ';margin-top:4px">' + fmt(x.prog.current) + ' / ' + fmt(x.prog.target) + '　差額 ' + fmt(x.prog.gap) + (x.prog.perMonth ? '　每月需 ' + fmt(x.prog.perMonth) : '') + '</div></div>';

    s.payRows.forEach(function (l) { if (l.due && diffDays(r.date, l.due) <= 14) rem.push('應付「' + esc(l.name) + '」' + fmt(l.amount) + ' 元，' + l.due + ' 到期'); });
    h += sec('09', '交割／現金流提醒', rem.length ? list(rem) + p('交割日以 T+2 營業日估算，遇國定假日順延，請以券商通知為準。', 'font-size:12px;color:' + C.sub) : p('近期無交割或到期款項。'));

    // 10 新聞
    function newsList(arr) {

      return arr.map(function (n) {
        return '<div style="padding:12px 0;border-bottom:1px solid ' + C.line + '"><a href="' + esc(n.link) + '" style="color:' + C.navy2 + ';font-weight:700;text-decoration:none;line-height:1.6">' + esc(n.title) + '</a>' +
          '<div style="font-size:12px;color:' + C.sub + ';margin-top:4px">' + esc(n.source || '') + (n.official ? '　◆官方／原始來源' : '') + (n.date ? '　' + esc(n.date) : '') + '</div>' +

          (n.watch ? p('<b>觀察重點</b>　' + esc(n.watch), 'margin:4px 0;font-size:13px') : '') + '</div>';
      }).join('');
    }
    h += sec('10', '每日財經新聞摘要', '<div style="font-weight:700;margin-top:8px">台灣</div>' + newsList(r.news.tw) + '<div style="font-weight:700;margin-top:16px">國際</div>' + newsList(r.news.intl));

    if (r.ai.lesson) h += sec('11', '今日理財小教室', aiBlock(r.ai.lesson));

  function md(t) {
    var lines = esc(t || '').split(/\n/), out = '', inList = '';
    function inline(s) { return s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>'); }
    lines.forEach(function (l) {
      var m;
      if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { if (inList !== 'ul') { out += inList ? '</' + inList + '>' : ''; out += '<ul>'; inList = 'ul'; } out += '<li>' + inline(m[1]) + '</li>'; return; }
      if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { if (inList !== 'ol') { out += inList ? '</' + inList + '>' : ''; out += '<ol>'; inList = 'ol'; } out += '<li>' + inline(m[1]) + '</li>'; return; }
      if (inList) { out += '</' + inList + '>'; inList = ''; }
      if ((m = l.match(/^#{1,6}\s+(.*)/))) { out += '<h4>' + inline(m[1]) + '</h4>'; return; }
      if (l.trim()) out += '<p>' + inline(l) + '</p>';
    });
    return out + (inList ? '</' + inList + '>' : '');
  }

      API.call('secrets', { secrets: sec }).then(function (r) { if (r.ok) { toast('金鑰已安全儲存'); route(); } else toast(r.error); });
    };
    addEye($('#pwO')); addEye($('#pwN')); bindPrivacy();
    $('#rcSave').onclick = function () { API.call('setRecovery', { email: val('rcMail') }).then(function (r) { if (r.ok) { $('#rcMail').value = r.email; toast('已設定重設信箱：' + r.email); } else toast(r.error); }); };
    $('#pwSave').onclick = function () {
      API.call('changePassword', { oldPassword: $('#pwO').value, newPassword: $('#pwN').value }).then(function (r) { if (r.ok) { API.setToken(r.token); toast('密碼已變更'); $('#pwO').value = $('#pwN').value = ''; } else toast(r.error || '失敗'); });
    };
    $('#exp').onclick = function () {
      var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S.data, null, 2)], { type: 'application/json' })); a.download = 'asset-compass-backup-' + FC.twDay() + '.json'; a.click();
    };
    $('#imp').onchange = function (e) {
      var f = e.target.files[0]; if (!f) return;
      var rd = new FileReader();
      rd.onload = function () {
        try { var d = JSON.parse(rd.result); if (!d.profile || !d.trades) throw new Error('格式不符'); }
        catch (err) { toast('匯入失敗：' + err.message); return; }
        openSheet('確認匯入', '<p>匯入將覆蓋目前所有資料，確定嗎？（雲端仍會保留每日備份）</p>', [{ label: '取消', ghost: true, fn: closeSheet }, { label: '覆蓋匯入', danger: true, fn: function () { var keep = S.data.updatedAt; S.data = FC.normalize(d); S.data.updatedAt = keep; closeSheet(); commit('已匯入'); route(); } }]);
      };
      rd.readAsText(f);
    };
    if ($('#apiChange')) $('#apiChange').onclick = function () { logout(); setupBackend(); };
  }

  // ═════════ 初始化 ═════════
  function init() {
    tick(); setInterval(tick, 1000);
    bindLogin();
    $('#backBtn').onclick = function () { var R = ROUTES[currentRoute()]; location.hash = typeof R.back === 'string' ? R.back : '#/more'; };
    $('#syncBtn').onclick = function () { if ($('#syncBtn').dataset.s === 'error') doSave(); else toast({ ok: '資料已同步到 Google 雲端硬碟', saving: '同步中…', demo: '示範模式，資料不會儲存' }[$('#syncBtn').dataset.s]); };
    $('#exitDemo').onclick = function () { logout(); };
    $('#shield').onclick = function () { if (!checkLock()) shield(false); };
    $('#lockForm').onsubmit = function (e) { e.preventDefault(); unlock(); };
    $('#lockOut').onclick = function () { S.locked = false; $('#lock').hidden = true; logout(''); };
    addEye($('#lockPw'));
    var q = new URLSearchParams(location.search);
    if (q.get('demo') === '1') { S.demo = true; startApp(); return; }
    if (GAS) { $('#setupBtn').hidden = true; $('#apiChangeWrap') && ($('#apiChangeWrap').hidden = true); }
    if (API.token() && API.ready()) startApp(); else showLogin();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

</script>
</body>
</html>
